name: "🚀 Deploy"
description: "배포 관련 작업"
title: "deploy: [배포 및 인프라 작업 선언]"
labels: ["devops"]
body:
  - type: textarea
    id: deploy-goals
    attributes:
      label: "📌 Goals"
      description: "이번 배포 인프라 작업의 핵심 목표를 적어주세요."
      value: |
        > Vercel 프로덕션 배포 및 신규 도메인 리다이렉트 연동
        - 
    validations:
      required: true

  - type: textarea
    id: deploy-tasks
    attributes:
      label: "🛠️ Tasks"
      description: "배포를 완료하기 위해 필요한 단계별 태스크입니다."
      value: |
        - [ ] Vercel 프로젝트 생성 및 깃허브 레포지토리 연동
        - [ ] 호스팅케이알에서 DNS 레코드(CNAME/A) 설정 변경
        - [ ] 프로덕션 도메인(`www.c-horok.com`) 및 리다이렉트 규칙 설정
        - [ ] 외부 API 키(Gemini 등) 환경 변수(Environment Variables) 등록
    validations:
      required: true

  - type: textarea
    id: deploy-cautions
    attributes:
      label: "⚠️ Cautions"
      description: "배포 시 누락되거나 보안상 주의해야 할 디테일을 기록합니다."
      value: |
        > API Secret Key 노출 주의 및 DNS 반영 시간(TTL) 고려
        - 
    validations:
      required: false